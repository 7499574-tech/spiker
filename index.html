<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Привіт">
<title>Привіт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=DM+Mono:wght@300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--bg2:#111;--bg3:#1c1c1e;--bg4:#2c2c2e;
  --t1:#fff;--t2:rgba(255,255,255,0.6);--t3:rgba(255,255,255,0.3);
  --acc:#c8a96e;--acc2:rgba(200,169,110,0.15);
  --sep:rgba(255,255,255,0.1);
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
  --mono:'DM Mono',monospace;
  --r:14px;--r2:20px;
}
html{background:var(--bg);color:var(--t1);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100dvh;padding:0;display:flex;flex-direction:column}

/* nav tabs */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--sep);padding:0 16px;padding-top:env(safe-area-inset-top,44px);flex-shrink:0}
.tab{flex:1;padding:14px 0;font-size:13px;font-weight:400;color:var(--t3);text-align:center;cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;letter-spacing:.02em;-webkit-tap-highlight-color:transparent}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}

/* screens */
.screen{display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:28px 20px calc(env(safe-area-inset-bottom,20px) + 80px)}
.screen.on{display:flex;flex-direction:column}

/* greeting */
.g-clock{font-family:var(--mono);font-size:12px;color:var(--t3);letter-spacing:.1em;margin-bottom:24px}
.g-clock span{color:var(--acc)}
.g-holiday{display:none;align-items:center;gap:8px;margin-bottom:16px;background:var(--acc2);border:1px solid rgba(200,169,110,0.3);border-radius:var(--r);padding:10px 14px}
.g-holiday.on{display:flex}
.g-holiday-dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex-shrink:0}
.g-holiday-txt{font-size:13px;color:var(--acc);letter-spacing:.04em}

/* mood selector */
.mood-row{display:flex;gap:8px;margin-bottom:24px}
.mood{flex:1;text-align:center;padding:10px 6px;background:var(--bg3);border-radius:var(--r);font-size:12px;color:var(--t2);cursor:pointer;border:1px solid transparent;transition:all .15s;-webkit-tap-highlight-color:transparent}
.mood.on{background:var(--acc2);border-color:rgba(200,169,110,0.4);color:var(--acc)}

/* card */
.card{background:var(--bg3);border-radius:var(--r2);padding:24px 20px;margin-bottom:16px;position:relative;overflow:visible}
.card-label{font-size:11px;font-family:var(--mono);color:var(--t3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
.card-main{font-family:var(--serif);font-size:clamp(17px,4.5vw,22px);font-weight:300;font-style:italic;line-height:1.55;color:var(--t1)}
.card-sub{font-size:14px;color:var(--t2);line-height:1.65;margin-top:14px;padding-top:14px;border-top:1px solid var(--sep)}
.card-toast{font-family:var(--serif);font-size:clamp(17px,5vw,22px);font-weight:300;font-style:italic;line-height:1.6;color:var(--t1)}

/* copy btn */
.copy-btn{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:var(--bg4);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:background .15s}
.copy-btn:active{background:rgba(200,169,110,0.3)}
.copy-btn svg{width:15px;height:15px;stroke:var(--t2);fill:none;stroke-width:1.8}
.copy-btn.copied svg{stroke:var(--acc)}

/* action buttons */
.actions{display:flex;gap:10px;margin-top:4px}
.act-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--bg3);border:none;border-radius:var(--r);padding:14px;font-size:13px;color:var(--t2);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s}
.act-btn:active{background:var(--bg4)}
.act-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.act-btn.primary{background:var(--acc);color:#000;font-weight:500}
.act-btn.primary:active{background:#b8954f}

/* toast form */
.field{margin-bottom:20px}
.field-label{font-size:12px;font-family:var(--mono);color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.field-input{width:100%;background:var(--bg3);border:1px solid var(--sep);border-radius:var(--r);padding:14px 16px;font-size:16px;color:var(--t1);outline:none;font-family:var(--sans);-webkit-appearance:none}
.field-input:focus{border-color:rgba(200,169,110,0.5)}
.field-input::placeholder{color:var(--t3)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:9px 16px;background:var(--bg3);border:1px solid var(--sep);border-radius:40px;font-size:13px;color:var(--t2);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.pill.on{background:var(--acc2);border-color:rgba(200,169,110,0.4);color:var(--acc)}

/* spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.sp{display:inline-block;width:16px;height:16px;border:1.5px solid rgba(255,255,255,0.1);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}

/* setup overlay */
.setup{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;gap:0}
.setup.hide{display:none}
.setup-icon{width:64px;height:64px;background:var(--bg3);border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.setup-icon svg{width:30px;height:30px;stroke:var(--acc);fill:none;stroke-width:1.5}
.setup-title{font-size:22px;font-weight:300;margin-bottom:8px;text-align:center}
.setup-hint{font-size:14px;color:var(--t2);text-align:center;margin-bottom:32px;line-height:1.5}
.setup-input{width:100%;max-width:360px;background:var(--bg3);border:1px solid var(--sep);border-radius:var(--r);padding:16px 18px;font-size:16px;color:var(--t1);outline:none;margin-bottom:12px;font-family:var(--mono);letter-spacing:.04em;-webkit-appearance:none}
.setup-input:focus{border-color:rgba(200,169,110,0.5)}
.setup-input::placeholder{color:var(--t3)}
.setup-btn{width:100%;max-width:360px;background:var(--acc);border:none;border-radius:var(--r);padding:16px;font-size:15px;font-weight:500;color:#000;cursor:pointer;letter-spacing:.02em}
.setup-err{color:#ff6b6b;font-size:13px;margin-top:12px;text-align:center;display:none;line-height:1.5;max-width:320px}
.setup-note{margin-top:20px;font-size:12px;color:var(--t3);text-align:center;line-height:1.7}
.setup-note a{color:var(--acc);text-decoration:none}

/* gear */
.gear-btn{position:fixed;bottom:calc(env(safe-area-inset-bottom,16px)+16px);right:16px;width:36px;height:36px;background:var(--bg3);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;-webkit-tap-highlight-color:transparent}
.gear-btn svg{width:16px;height:16px;stroke:var(--t3);fill:none;stroke-width:1.8}

.section-gap{height:8px}
</style>
</head>
<body>

<div class="setup hide" id="setup">
  <div class="setup-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
  <div class="setup-title">Gemini API ключ</div>
  <div class="setup-hint">Безкоштовно — ключ зберігається<br>тільки на вашому пристрої</div>
  <input class="setup-input" id="key-input" type="password" placeholder="AIza..." autocomplete="off" spellcheck="false">
  <button class="setup-btn" onclick="saveKey()">Зберегти</button>
  <div class="setup-err" id="s-err"></div>
  <div class="setup-note"><a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com</a> → безкоштовно</div>
</div>

<div class="tabs">
  <div class="tab on" id="tab-greet" onclick="showTab('greet')">Привітання</div>
  <div class="tab" id="tab-toast" onclick="showTab('toast')">Тост</div>
</div>

<!-- Greeting -->
<div class="screen on" id="scr-greet">
  <div class="g-clock"><span id="ct">--:--</span> · <span id="cd"></span></div>

  <div class="g-holiday" id="hday">
    <div class="g-holiday-dot"></div>
    <div class="g-holiday-txt" id="htxt"></div>
  </div>

  <div class="field-label" style="margin-bottom:8px">Настрій</div>
  <div class="mood-row" style="margin-bottom:24px">
    <div class="mood on" onclick="selGMood(this)" data-v="ніжно і щиро, як тепле обійняття">Ніжно</div>
    <div class="mood" onclick="selGMood(this)" data-v="іронічно і дотепно, з гумором">Іронічно</div>
    <div class="mood" onclick="selGMood(this)" data-v="пікантно, з легким еротичним підтекстом, сміливо але елегантно">Пікантно</div>
  </div>

  <div class="card" id="greet-card">
    <button class="copy-btn" id="copy-greet" onclick="copyText('greet-main','copy-greet')" title="Копіювати">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
    <div class="card-label" id="greet-period">Привітання</div>
    <div class="card-main" id="greet-main"><div class="sp"></div></div>
  </div>

  <div class="actions">
    <button class="act-btn primary" onclick="gen()">
      <svg viewBox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      Нове
    </button>
  </div>
</div>

<!-- Toast -->
<div class="screen" id="scr-toast">
  <div class="field">
    <div class="field-label">Ім'я</div>
    <input class="field-input" id="t-name" type="text" placeholder="Іменинник, молодята, господарі..." spellcheck="false">
  </div>

  <div class="field">
    <div class="field-label">Привід</div>
    <div class="pills">
      <div class="pill on" onclick="selPill(this,'occ')" data-v="день народження">День народження</div>
      <div class="pill" onclick="selPill(this,'occ')" data-v="весілля">Весілля</div>
      <div class="pill" onclick="selPill(this,'occ')" data-v="ювілей">Ювілей</div>
      <div class="pill" onclick="selPill(this,'occ')" data-v="новосілля">Новосілля</div>
    </div>
  </div>

  <div class="field">
    <div class="field-label">Настрій</div>
    <div class="mood-row">
      <div class="mood on" onclick="selPill(this,'mood')" data-v="ніжно і щиро, як тепле обійняття">Ніжно</div>
      <div class="mood" onclick="selPill(this,'mood')" data-v="іронічно і дотепно, з гумором">Іронічно</div>
      <div class="mood" onclick="selPill(this,'mood')" data-v="пікантно, з легким еротичним підтекстом, сміливо але елегантно">Пікантно</div>
    </div>
  </div>

  <button class="act-btn primary" style="margin-bottom:20px" onclick="genToast()">
    <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    Згенерувати тост
  </button>

  <div class="card" id="toast-card" style="display:none">
    <button class="copy-btn" id="copy-toast" onclick="copyText('toast-text','copy-toast')" title="Копіювати">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
    <div class="card-label">Тост</div>
    <div class="card-toast" id="toast-text"></div>
  </div>

  <div class="actions" id="toast-actions" style="display:none">
    <button class="act-btn" onclick="genToast()">
      <svg viewBox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      Інший варіант
    </button>
  </div>
</div>

<button class="gear-btn" onclick="openSettings()">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

<script>
const H=[[1,1,"Новий рік"],[1,7,"Різдво Христове"],[1,19,"Водохреще"],[2,14,"День закоханих"],[2,23,"День захисника України"],[3,8,"Міжнародний жіночий день"],[4,1,"День гумору"],[5,1,"День праці"],[5,9,"День перемоги над нацизмом"],[6,1,"День захисту дітей"],[6,28,"День Конституції України"],[8,24,"День незалежності України"],[10,14,"День захисників України"],[12,19,"День Святого Миколая"],[12,25,"Різдво католицьке"]];
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);return[Math.floor((h+l-7*m+114)/31),((h+l-7*m+114)%31)+1]}
function holiday(d){const m=d.getMonth()+1,day=d.getDate(),y=d.getFullYear();const f=H.find(h=>h[0]===m&&h[1]===day);if(f)return f[2];const[em,ed]=easter(y);if(m===em&&day===ed)return"Великдень";const t=new Date(y,em-1,ed+49);if(t.getMonth()+1===m&&t.getDate()===day)return"Трійця";return null}
function period(h){if(h>=5&&h<12)return"Ранок";if(h>=12&&h<17)return"День";if(h>=17&&h<21)return"Вечір";return"Ніч"}
function periodUk(h){if(h>=5&&h<12)return"ранку";if(h>=12&&h<17)return"дня";if(h>=17&&h<21)return"вечора";return"ночі"}
const DAYS=["неділя","понеділок","вівторок","середа","четвер","п'ятниця","субота"];
const MON=["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];

function clock(){const n=new Date();document.getElementById('ct').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');document.getElementById('cd').textContent=DAYS[n.getDay()]+', '+n.getDate()+' '+MON[n.getMonth()]}

function getKey(){return localStorage.getItem('gkey')||''}
function saveKey(){const k=document.getElementById('key-input').value.trim();if(!k)return;localStorage.setItem('gkey',k);document.getElementById('s-err').style.display='none';document.getElementById('setup').classList.add('hide');gen()}
function openSettings(){document.getElementById('key-input').value=getKey();document.getElementById('s-err').style.display='none';document.getElementById('setup').classList.remove('hide')}

function showTab(t){
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('on'));
  document.getElementById('tab-'+t).classList.add('on');
  document.getElementById('scr-'+t).classList.add('on');
}

function selGMood(el){document.querySelectorAll('#scr-greet .mood').forEach(m=>m.classList.remove('on'));el.classList.add('on')}
function selPill(el,group){
  const parent=el.closest('.pills,.mood-row');
  parent.querySelectorAll('.pill,.mood').forEach(p=>p.classList.remove('on'));
  el.classList.add('on');
}
function getGMood(){return document.querySelector('#scr-greet .mood.on')?.dataset.v||'тепло і щиро'}
function getOcc(){return document.querySelector('#scr-toast .pills .pill.on')?.dataset.v||'день народження'}
function getTMood(){return document.querySelector('#scr-toast .mood-row .mood.on')?.dataset.v||'ніжно і тепло'}

function copyText(elId, btnId){
  const main=document.getElementById('greet-main')?.textContent||'';
  const sub=document.getElementById('greet-sub')?.textContent||'';
  const toast=document.getElementById('toast-text')?.textContent||'';
  let text='';
  if(elId==='greet-main') text=main+(sub?'\n'+sub:'');
  else text=toast;
  navigator.clipboard?.writeText(text.trim()).then(()=>{
    const btn=document.getElementById(btnId);
    btn.classList.add('copied');
    setTimeout(()=>btn.classList.remove('copied'),1500);
  });
}

async function gemini(prompt){
  const key=getKey();
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+key,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      system_instruction:{parts:[{text:'Ти талановитий український письменник. Пишеш короткі, влучні привітання і тости — залежно від заданого жанру і настрою. Твій стиль: живий, образний, без штампів і кліше. Ніколи не використовуй зірочки, хештеги, списки. Завжди пишеш завершені речення що закінчуються крапкою, знаком оклику або знаком питання.'}]},
      contents:[{parts:[{text:prompt}]}],
      generationConfig:{temperature:1.1,maxOutputTokens:1000}
    })
  });
  const d=await r.json();
  if(d.error)throw new Error(d.error.message);
  let t=(d.candidates?.[0]?.content?.parts?.[0]?.text||'').replace(/\*\*/g,'').replace(/\*/g,'').replace(/^#+\s*/gm,'').trim();
  if(t && !t.endsWith('.') && !t.endsWith('!') && !t.endsWith('?')){
    const last=Math.max(t.lastIndexOf('.'),t.lastIndexOf('!'),t.lastIndexOf('?'));
    if(last>0) t=t.substring(0,last+1);
  }
  return t;
}

async function gen(){
  const now=new Date(),h=now.getHours();
  const p=period(h),pu=periodUk(h),hol=holiday(now),wd=DAYS[now.getDay()];
  const mood=getGMood();
  document.getElementById('greet-period').textContent=p;
  const hd=document.getElementById('hday');
  if(hol){document.getElementById('htxt').textContent=hol;hd.classList.add('on')}else{hd.classList.remove('on')}
  const mel=document.getElementById('greet-main');
  mel.innerHTML='<div class="sp"></div>';
  const prompt=hol
    ?`Напиши привітання українською. Рівно 2 речення. Час доби: ${pu}. Свято: ${hol}. Настрій: ${mood}. Без зірочок. Кожне речення закінчується крапкою.`
    :`Напиши привітання для ${pu} українською. Рівно 2 речення. День тижня: ${wd}. Настрій: ${mood}. Без зірочок. Кожне речення закінчується крапкою.`;
  try{
    const m=await gemini(prompt);
    mel.textContent=m;
  }catch(e){
    if(e.message.includes('quota')||e.message.includes('429')){
      mel.textContent='Зачекайте хвилину і спробуйте ще раз.';
    } else {
      mel.textContent='';
      const err=document.getElementById('s-err');
      err.textContent=e.message;err.style.display='block';
      document.getElementById('setup').classList.remove('hide');
    }
  }
}

async function genToast(){
  const name=document.getElementById('t-name').value.trim();
  const occ=getOcc(),mood=getTMood();
  const nameStr=name?`Ім'я: ${name}.`:'';
  const prompt=`Напиши тост українською. ${nameStr} Привід: ${occ}. Настрій: ${mood}. 3-5 речень, живий, без кліше. Без зірочок. Тільки текст тосту.`;
  const card=document.getElementById('toast-card');
  const txt=document.getElementById('toast-text');
  const actions=document.getElementById('toast-actions');
  card.style.display='block';
  actions.style.display='flex';
  txt.innerHTML='<div class="sp"></div>';
  try{
    const t=await gemini(prompt);
    txt.textContent=t;
  }catch(e){txt.textContent='Помилка: '+e.message}
}

clock();setInterval(clock,30000);
if(!getKey()){document.getElementById('setup').classList.remove('hide')}
else{document.getElementById('greet-main').textContent='Натисніть "Нове" для привітання';}
</script>
